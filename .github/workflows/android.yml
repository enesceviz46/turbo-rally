name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor kur
        run: npm i @capacitor/core @capacitor/cli @capacitor/android

      - name: Android projesini olustur
        run: npx cap add android

      - name: Ikon ve acilis ekranlarini uret
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0420' --splashBackgroundColor '#0a0420'

      - name: Dikey ekrana kilitle
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml

      - name: Senkronla
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: turbo-rally-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
