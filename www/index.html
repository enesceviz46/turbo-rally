html{scroll-padding-top:env(safe-area-inset-top,0px)}

button:active{transform:translateY(2px);border-bottom-width:1px}
.card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),3px 3px 0 #0a0a22}
.row>span:first-child{flex:1}

.cars{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:#12123a;border:2px solid #335;padding:6px;text-align:center;font-size:12px}
.card.sel{border-color:#ff3d81}
.card canvas{display:block;margin:0 auto 4px}
.row>span:first-child{flex:1}
.row{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:6px;margin:5px 0}
.no{opacity:.45}.lock{opacity:.75}.lock canvas{filter:grayscale(1) brightness(.35)}
.c{text-align:center;margin:8px 0}
#pz{position:absolute;right:14px;bottom:84px;width:40px;height:40px;border-radius:50%;background:#556;border-bottom-color:#223;display:none;z-index:2;padding:0}
#nit{position:absolute;right:8px;bottom:8px;width:64px;height:64px;border-radius:50%;background:#ff8a00;border-bottom-color:#a14d00;display:none;z-index:2;font-size:12px}
p{color:var(--mut);font-size:12px;text-align:center;margin:8px 0;max-width:360px}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
#stage{display:grid;grid-template-areas:"w w" "l r";grid-template-columns:1fr 1fr;justify-items:center;width:100%;max-width:520px;row-gap:8px}
#w{grid-area:w}
.pad{display:none;gap:12px;align-items:center;touch-action:none;visibility:hidden}
body.racing .pad{visibility:visible}
#padL{grid-area:l;justify-self:start}#padR{grid-area:r;justify-self:end}
.pad button{width:clamp(72px,22vw,108px);height:clamp(72px,22vw,108px);border-radius:20px;font-size:28px;padding:0;touch-action:none;background:#ff3d81;color:#fff;border:0;border-bottom:5px solid #a01b4f;font-family:inherit;font-weight:bold}
.pad button:active{transform:translateY(3px);border-bottom-width:2px}
#bB{background:#556;border-bottom-color:#223;font-size:14px}
#bN{background:#ff8a00;border-bottom-color:#a14d00;font-size:14px}
#tiltTag{display:none;color:#9ff;font-size:13px;font-weight:bold;padding:0 10px}
body.mob .pad{display:flex}
body.mob #nit{display:none!important}
body.mob p{display:none}
body.mob{padding:4px;min-height:100dvh;justify-content:center}
body.mob #w{width:min(100%,520px,calc((100dvh - 150px) * 2 / 3))}
body.tilt #bL,body.tilt #bR{display:none}
body.tilt #tiltTag{display:block}
@media (orientation:landscape) and (max-height:560px){
body.mob #stage{grid-template-areas:"l w r";grid-template-columns:1fr auto 1fr;align-items:center;max-width:none}

}
@media (pointer:coarse){#ui button{min-height:42px}#ui{font-size:14px}}
body.mob #w{min-width:0}
body.mob:not(.racing) .pad{display:none}
@media (orientation:portrait){body.mob:not(.racing) #w{aspect-ratio:auto;width:min(100%,520px);height:calc(100dvh - 20px)}}
@media (pointer:coarse){#ui button[data-mode]{padding:6px 9px;font-size:12px}}
